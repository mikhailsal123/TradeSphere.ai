services:
  - type: web
    name: tradesphere-frontend
    env: node
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # URL of the Flask Web Service (not this Next.js URL). Required so the intro page can load the iframe after "Execute Trades".
      - key: NEXT_PUBLIC_FLASK_BACKEND_URL
        sync: false
