                alt="TradeSphere"

                decoding="sync"

<script>
(function () {
    function bindFooterLandingLinks() {
        document.querySelectorAll("[data-ts-footer-home-link]").forEach(function (link) {
            link.addEventListener("click", function (e) {
                var inFrame = false;
                try {
                    inFrame = window.parent && window.parent !== window;
                } catch (err) {
                    inFrame = false;
                }
                if (inFrame) {
                    e.preventDefault();
                    try {
                        window.parent.postMessage({ type: "tradesphere-landing-home" }, "*");
                    } catch (err2) {}
                }
            });
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindFooterLandingLinks);
    } else {
        bindFooterLandingLinks();
    }
})();
</script>
